services:
  ses:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ses
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ses-db
      - DB_USERNAME=ses
      - DB_PASSWORD=pass
    depends_on:
      - ses-db
    command: bash -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"

  ses-db:
    image: mysql:8.0
    container_name: ses-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ses
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ses
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - ses-mysql-data:/var/lib/mysql

volumes:
  ses-mysql-data:
