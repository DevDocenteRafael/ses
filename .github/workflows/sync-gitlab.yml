name: Mirror para GitLab SENAC

# A cada push no GitHub, espelha o codigo para o GitLab do Senac.
# Requer o secret GITLAB_TOKEN configurado em:
#   Settings > Secrets and variables > Actions > New repository secret
#   (use um Personal Access Token do GitLab com escopo "write_repository")

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historia completa)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnostico e push para o GitLab SENAC
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e
          export GIT_TERMINAL_PROMPT=0

          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::Secret GITLAB_TOKEN nao esta definido ou esta vazio. Crie/edite em Settings > Secrets and variables > Actions (nome exato: GITLAB_TOKEN)."
            exit 1
          fi
          echo "Secret GITLAB_TOKEN presente (tamanho: ${#GITLAB_TOKEN} caracteres)."

          echo "::group::Teste 1 - conectividade HTTP (sem autenticacao)"
          resp1=$(curl -sS --max-time 20 -w "\nHTTP_CODE:%{http_code}" "https://gitlab.edu.df.senac.br" 2>&1 || true)
          code1=$(echo "${resp1}" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
          echo "HTTP status pagina inicial: ${code1}"
          if [ -z "${code1}" ] || [ "${code1}" = "000" ]; then
            echo "::error::O runner do GitHub NAO conseguiu acessar https://gitlab.edu.df.senac.br (rede/firewall). Saida: $(echo "${resp1}" | tail -c 200)"
            exit 1
          fi
          if echo "${resp1}" | grep -qi "azurefd\|Access Denied\|Request blocked"; then
            echo "::error::WAF/CDN (Azure Front Door) bloqueou o runner do GitHub na pagina inicial (HTTP ${code1}). O mirror pelo GitHub Actions nao sera possivel; o hook local continua funcionando."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Teste 2 - validade do token via API do GitLab"
          resp2=$(curl -sS --max-time 20 -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" -w "\nHTTP_CODE:%{http_code}" "https://gitlab.edu.df.senac.br/api/v4/user" 2>&1 || true)
          code2=$(echo "${resp2}" | grep -o "HTTP_CODE:[0-9]*" | cut -d: -f2)
          body2=$(echo "${resp2}" | sed '/HTTP_CODE:/d' | head -c 300)
          echo "HTTP status da API /api/v4/user: ${code2}"
          if [ "${code2}" != "200" ]; then
            echo "::error::API /api/v4/user retornou HTTP ${code2}. Resposta: ${body2}"
            if [ "${code2}" = "403" ] || [ "${code2}" = "401" ]; then
              echo "::error::Causa provavel: token invalido, revogado ou sem permissao. Gere novo Personal Access Token no GitLab (escopo api + write_repository) e atualize o secret GITLAB_TOKEN."
            fi
            exit 1
          fi
          echo "Token validado com sucesso via API."
          echo "::endgroup::"

          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.edu.df.senac.br/Rafael51555207/ses.git"

          echo "::group::Teste 3 - git ls-remote"
          if ! out=$(git ls-remote gitlab HEAD 2>&1); then
            echo "::error::git ls-remote falhou. Saida do git: ${out}"
            exit 1
          fi
          echo "ls-remote OK: ${out}"
          echo "::endgroup::"

          git push gitlab "refs/heads/${GITHUB_REF_NAME}:refs/heads/${GITHUB_REF_NAME}" --force
          echo "::notice::Mirror para o GitLab concluido com sucesso (branch ${GITHUB_REF_NAME})."
