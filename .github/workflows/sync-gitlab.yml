name: Mirror para GitLab SENAC

# A cada push no GitHub, espelha o codigo para o GitLab do Senac.
# Requer o secret GITLAB_TOKEN configurado em:
#   Settings > Secrets and variables > Actions > New repository secret
#   (use um Personal Access Token do GitLab com escopo "write_repository")

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historia completa)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnostico e push para o GitLab SENAC
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e
          export GIT_TERMINAL_PROMPT=0

          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::Secret GITLAB_TOKEN nao esta definido ou esta vazio. Crie/edite em Settings > Secrets and variables > Actions (nome exato: GITLAB_TOKEN)."
            exit 1
          fi
          echo "Secret GITLAB_TOKEN presente (tamanho: ${#GITLAB_TOKEN} caracteres)."

          echo "::group::Teste 1 - conectividade HTTP (sem autenticacao)"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://gitlab.edu.df.senac.br" || echo "curl-falhou")
          echo "HTTP status da pagina inicial do GitLab: ${code}"
          if [ "${code}" = "curl-falhou" ] || [ "${code}" = "000" ]; then
            echo "::error::O runner do GitHub NAO conseguiu acessar https://gitlab.edu.df.senac.br (rede/firewall). O mirror no servidor nao sera possivel; use apenas o hook local."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Teste 2 - validade do token via API do GitLab"
          apicode=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "https://gitlab.edu.df.senac.br/api/v4/user" || echo "curl-falhou")
          echo "HTTP status da API /api/v4/user: ${apicode}"
          if [ "${apicode}" = "401" ] || [ "${apicode}" = "403" ]; then
            echo "::error::Token GITLAB_TOKEN INVALIDO ou sem permissao (API retornou ${apicode}). Gere um novo Personal Access Token no GitLab com escopo write_repository e atualize o secret."
            exit 1
          fi
          if [ "${apicode}" != "200" ]; then
            echo "::warning::A API retornou ${apicode} (esperado 200). Tentando mesmo assim o push via git..."
          fi
          echo "::endgroup::"

          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.edu.df.senac.br/Rafael51555207/ses.git"

          echo "::group::Teste 3 - git ls-remote"
          if ! out=$(git ls-remote gitlab HEAD 2>&1); then
            echo "::error::git ls-remote falhou. Saida do git: ${out}"
            exit 1
          fi
          echo "ls-remote OK: ${out}"
          echo "::endgroup::"

          git push gitlab "refs/heads/${GITHUB_REF_NAME}:refs/heads/${GITHUB_REF_NAME}" --force
          echo "::notice::Mirror para o GitLab concluido com sucesso (branch ${GITHUB_REF_NAME})."
