<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Empresas - Senac DF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <div class="d-flex">
        <!-- Sidebar Admin -->
        <div class="sidebar d-none d-lg-block" id="sidebar" style="width: 280px;">
            <button class="sidebar-toggle" id="toggleSidebar">
                <i data-lucide="chevron-left"></i>
            </button>
            <div class="px-4 mb-5 text-center">
                <img src="https://www.df.senac.br/wp-content/uploads/2023/12/logo-senac-300x163.png" alt="Senac"
                    style="height: 40px; filter: brightness(0) invert(1);">
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="admin-dashboard.html">
                    <i data-lucide="pie-chart"></i> <span class="sidebar-text">Relatórios Geral</span>
                </a>
                <a class="nav-link active" href="admin-empresas.html">
                    <i data-lucide="building"></i> <span class="sidebar-text">Gestão de Empresas</span>
                </a>
                <a class="nav-link" href="admin-alunos.html">
                    <i data-lucide="users"></i> <span class="sidebar-text">Gestão dos Candidatos</span>
                </a>
                <div class="mt-auto p-4">
                    <a class="nav-link text-white-50" href="#" id="logoutBtn">
                        <i data-lucide="log-out"></i> <span class="sidebar-text">Sair</span>
                    </a>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 p-4 p-md-5">
            <header class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="h3 mb-1">Gestão de Empresas</h2>
                    <p class="text-muted">Aprovação e controle de acesso de parceiros corporativos (FR35)</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary"
                        onclick="alert('Sincronização de empresas com o SIG iniciada...')">
                        <i data-lucide="refresh-cw" class="me-2" style="width:16px"></i> Sincronizar SIG
                    </button>
                </div>
            </header>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Histórico de Empresas</h5>
                    <div class="input-group input-group-sm w-auto" style="max-width: 300px;">
                        <input type="text" id="searchInput" class="form-control" placeholder="Buscar por Nome ou CNPJ">
                        <button class="btn btn-primary" id="searchBtn"><i data-lucide="search"
                                style="width:14px"></i></button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">Empresa</th>
                                <th>CNPJ</th>
                                <th>Atividade</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="companyTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mockData.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCompanies();

            // Search handler
            document.getElementById('searchInput').addEventListener('input', () => {
                renderCompanies();
            });
            document.getElementById('searchBtn').addEventListener('click', () => {
                renderCompanies();
            });
        });

        function renderCompanies() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const tableBody = document.getElementById('companyTableBody');
            const companies = MockAPI.getCompanies();

            const filtered = companies.filter(c => {
                return c.name.toLowerCase().includes(query) || c.cnpj.includes(query);
            });

            tableBody.innerHTML = '';

            if (filtered.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted">Nenhuma empresa encontrada.</td>
                    </tr>
                `;
                return;
            }

            filtered.forEach(company => {
                const tr = document.createElement('tr');

                const isLiberado = company.status === 'Liberado';
                const statusBadge = isLiberado ?
                    `<span class="badge bg-success bg-opacity-10 text-success">Liberado</span>` :
                    `<span class="badge bg-danger bg-opacity-10 text-danger">Bloqueado</span>`;

                const actionButton = isLiberado ?
                    `<button class="btn btn-sm btn-outline-danger" onclick="toggleAccess(${company.id}, 'Bloqueado')">Bloquear Acesso</button>` :
                    `<button class="btn btn-sm btn-success" onclick="toggleAccess(${company.id}, 'Liberado')">Liberar Acesso</button>`;

                tr.innerHTML = `
                    <td class="ps-4">
                        <div class="fw-bold">${company.name}</div>
                        <small class="text-muted">Responsável: ${company.responsible}</small>
                    </td>
                    <td>${company.cnpj}</td>
                    <td>${company.activity}</td>
                    <td>${statusBadge}</td>
                    <td class="text-end pe-4">
                        ${actionButton}
                    </td>
                `;

                tableBody.appendChild(tr);
            });

            lucide.createIcons();
        }

        function toggleAccess(id, newStatus) {
            const actionVerb = newStatus === 'Liberado' ? 'liberar' : 'bloquear';
            if (confirm(`Deseja ${actionVerb} o acesso desta empresa?`)) {
                MockAPI.updateCompany(id, { status: newStatus });
                renderCompanies();
                alert(`Acesso da empresa atualizado para ${newStatus} com sucesso!`);
            }
        }
    </script>
</body>

</html>
